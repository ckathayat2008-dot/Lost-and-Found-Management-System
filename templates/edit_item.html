
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item - Lost & Found</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar">
    <div class="logo">Lost & Found</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/items/">All Items</a>
        <a href="/dashboard/">Dashboard</a>
    </div>
</nav>

<section class="hero">

    <h1>Edit Item</h1>
    <p>Update your reported item information.</p>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Item Name</label>
        <input type="text" name="item_name"
               value="{{ item.item_name }}" required>

        <br><br>

        <label>Category</label>
        <select name="category" required>
            {% for value, label in categories %}
                <option value="{{ value }}"
                    {% if item.category == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Description</label>
        <textarea name="description" rows="4" required>{{ item.description }}</textarea>

        <br><br>

        <label>Location</label>
        <input type="text" name="location"
               value="{{ item.location }}" required>

        <br><br>

        <label>Date Lost / Found</label>
        <input type="date" name="date_lost_found"
               value="{{ item.date_lost_found|date:'Y-m-d' }}" required>

        <br><br>

        <label>Contact Number</label>
        <input type="tel" name="contact_number"
               value="{{ item.contact_number }}" maxlength="15" required>

        <br><br>

        <button type="submit" class="btn">Update Item</button>

        <a href="{% url 'dashboard' %}" class="btn">Cancel</a>

    </form>

</section>

<footer class="footer">
    <p>Lost & Found Management System</p>
</footer>

</body>
</html>
